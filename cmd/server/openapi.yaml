openapi: 3.1.0
info:
  title: SubShare Admin API
  version: 1.0.0
  description: |
    Versioned administration API for SubShare. Browser sessions use the
    `subshare_admin_session` cookie and CSRF protection on unsafe requests. API
    clients use a scoped bearer token created in Security settings.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: System
  - name: Admins
  - name: Users
  - name: Keys
  - name: Subscription
  - name: Security
  - name: Operations
paths:
  /openapi.yaml:
    get:
      tags: [System]
      summary: Download this OpenAPI document
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema: { type: string }
  /build-info:
    get:
      tags: [System]
      summary: Build and database schema information
      responses:
        "200":
          description: Build information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildInfo" }
        default: { $ref: "#/components/responses/Error" }
  /dashboard:
    get:
      tags: [System]
      summary: Dashboard counters and recent audit events
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        default: { $ref: "#/components/responses/Error" }
  /users:
    get:
      tags: [Users]
      summary: Search and paginate users
      parameters:
        - { $ref: "#/components/parameters/Query" }
        - { name: status, in: query, schema: { type: string, enum: [all, active, expired, paused, blocked, limited] } }
        - { name: sort, in: query, schema: { type: string, enum: [created_desc, name_asc, expires_asc] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: User page
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageEnvelope" }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/UserSummary" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUser" }
      responses:
        "200": { description: User created }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /users/{id}:
    get:
      tags: [Users]
      summary: User detail
      parameters:
        - { $ref: "#/components/parameters/ID" }
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Users]
      summary: Delete a user
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: User deleted }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /users/{id}/subscription:
    patch:
      tags: [Users, Subscription]
      summary: Partially update user subscription overrides
      description: Omitted fields are preserved; null clears an override so the global value is inherited.
      parameters:
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchUserSubscription" }
      responses:
        "200": { description: Subscription settings updated }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      deprecated: true
      tags: [Users, Subscription]
      summary: Legacy full subscription update
      parameters:
        - { $ref: "#/components/parameters/ID" }
      responses:
        "200": { description: Subscription settings updated }
        default: { $ref: "#/components/responses/Error" }
  /users/{id}/key-assignment:
    put:
      tags: [Users, Keys]
      summary: Set automatic or fixed key assignment mode
      parameters:
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyAssignment" }
      responses:
        "200": { description: Key assignment updated atomically }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /users/{id}/keys:
    put:
      deprecated: true
      tags: [Users, Keys]
      summary: Replace selected key assignments (compatibility adapter)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyIDsRequest" }
      responses:
        "200": { description: Key assignments updated }
        default: { $ref: "#/components/responses/Error" }
  /users/{id}/settings:
    put:
      tags: [Users]
      summary: Update user locale settings
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [time_zone, language]
              properties:
                time_zone: { type: string, maxLength: 64 }
                language: { type: string, maxLength: 16 }
      responses:
        "200": { description: User settings updated }
        default: { $ref: "#/components/responses/Error" }
  /users/{id}/hwid:
    put:
      tags: [Users]
      summary: Update a user's device limit
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [max_devices]
              properties:
                max_devices: { type: integer, minimum: 0 }
      responses:
        "200": { description: Device limit updated }
        default: { $ref: "#/components/responses/Error" }
  /users/{id}/hwid/{hwid}:
    delete:
      tags: [Users]
      summary: Remove a connected device
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: hwid, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Device removed }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /users/{id}/subscription-urls:
    get:
      tags: [Users, Subscription]
      summary: Return a user's subscription URLs
      description: Sensitive response containing a subscription access identifier; served with no-store headers.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Plain and optionally encrypted subscription URLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  plain_url: { type: string, format: uri }
                  encrypted_url: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /users/full:
    get:
      deprecated: true
      tags: [Users]
      summary: Rich user projection used by the current administration UI
      description: Sensitive projection containing activation/subscription identifiers and device details; served with no-store headers.
      responses:
        "200":
          description: Rich user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { type: object, additionalProperties: true }
        default: { $ref: "#/components/responses/Error" }
  /admins:
    get:
      tags: [Admins]
      summary: List administrator accounts
      responses:
        "200":
          description: Administrator list
          content:
            application/json:
              schema:
                type: object
                properties:
                  admins:
                    type: array
                    items: { type: object, additionalProperties: true }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Admins]
      summary: Create an administrator account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdministrator" }
      responses:
        "200": { description: Administrator created }
        default: { $ref: "#/components/responses/Error" }
  /admins/{id}:
    put:
      tags: [Admins]
      summary: Update an administrator account
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdministrator" }
      responses:
        "200": { description: Administrator updated }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Admins]
      summary: Delete an administrator account
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Administrator deleted }
        default: { $ref: "#/components/responses/Error" }
  /keys:
    get:
      tags: [Keys]
      summary: Search and paginate keys
      parameters:
        - { $ref: "#/components/parameters/Query" }
        - { name: status, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Key page
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageEnvelope" }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/KeySummary" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Keys]
      summary: Create a local key profile
      description: Accepts either a raw URI or a structured profile. Secret fields are write-only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateKeyProfile" }
      responses:
        "201":
          description: Key created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyProfileEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /keys/{id}:
    get:
      tags: [Keys]
      summary: Fetch safe key profile detail
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Safe profile detail without decrypted credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyProfileEnvelope" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [Keys]
      summary: Update key profile with optimistic concurrency
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateKeyProfile" }
      responses:
        "200":
          description: Key updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyProfileEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Keys]
      summary: Delete a key
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Key deleted }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /keys/{id}/reveal:
    post:
      tags: [Keys]
      summary: Reveal secret materials for profile
      description: Explicit no-cache secret access. Viewer sessions are forbidden and bearer tokens require `keys:write`.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyRevealRequest" }
      responses:
        "200":
          description: Decrypted secrets returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyRevealEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /keys/{id}/clone:
    post:
      tags: [Keys]
      summary: Clone key as unlinked local profile
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyCloneRequest" }
      responses:
        "201":
          description: Local copy created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyProfileEnvelope" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /keys/{id}/check:
    post:
      tags: [Keys, Operations]
      summary: Run a health check for one key
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Health-check result }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /keys/check-all:
    post:
      tags: [Keys, Operations]
      summary: Queue a health check for all eligible keys
      responses:
        "202": { description: Health-check job queued }
        default: { $ref: "#/components/responses/Error" }
  /keys/bulk/status:
    post:
      tags: [Keys]
      summary: Update status and optional category for selected keys
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkKeyStatusRequest" }
      responses:
        "200": { description: Keys updated }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /keys/bulk/delete:
    post:
      tags: [Keys]
      summary: Delete selected keys atomically
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyIDsRequest" }
      responses:
        "200": { description: Keys deleted }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /keys/order:
    put:
      tags: [Keys]
      summary: Replace the complete key order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyIDsRequest" }
      responses:
        "200": { description: Keys reordered }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /key-categories:
    get:
      tags: [Keys]
      summary: List key categories
      responses:
        "200":
          description: Key categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/KeyCategory" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Keys]
      summary: Create a key category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateKeyCategory" }
      responses:
        "200": { description: Category created }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [Keys]
      summary: Update a key category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateKeyCategory" }
      responses:
        "200": { description: Category updated }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /key-categories/order:
    put:
      tags: [Keys]
      summary: Replace the complete category order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyCategoryOrder" }
      responses:
        "200": { description: Categories reordered }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /key-categories/rename:
    put:
      tags: [Keys]
      summary: Rename a key category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameKeyCategory" }
      responses:
        "200": { description: Category renamed }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /key-categories/delete:
    post:
      tags: [Keys]
      summary: Delete a key category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteKeyCategory" }
      responses:
        "200": { description: Category deleted }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /key-editor-schema:
    get:
      tags: [Keys]
      summary: Fetch backend-owned key editor schemas and options
      responses:
        "200": { description: Editor schema options }
        default: { $ref: "#/components/responses/Error" }
  /sources:
    get:
      tags: [Operations]
      summary: Paginate safe external subscription source summaries
      parameters:
        - { $ref: "#/components/parameters/Query" }
        - { name: status, in: query, schema: { type: string, enum: [all, disabled, idle, syncing, ok, error] } }
        - { name: sort, in: query, schema: { type: string, enum: [last_sync_desc, name_asc, created_asc] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Source page without full URLs or HWID values
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageEnvelope" }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SourceSummary" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Operations]
      summary: Import a validated external source
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceInput" }
      responses:
        "201": { description: Source and imported keys created atomically }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /sources/preview:
    post:
      tags: [Operations]
      summary: Fetch, validate and preview a source without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourcePreviewInput" }
      responses:
        "200":
          description: Detected format, metadata, stable warning codes and secret-free item results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourcePreview" }
        default: { $ref: "#/components/responses/Error" }
  /sources/{id}:
    get:
      tags: [Operations]
      summary: Source details for owner editing
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Full source URL and has_hwid_value flag; never the stored HWID
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SourceDetail" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [Operations]
      summary: Update an external source
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceInput" }
      responses:
        "200": { description: Source updated }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Operations]
      summary: Delete an external source
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Source deleted }
        default: { $ref: "#/components/responses/Error" }
  /sources/{id}/sync:
    post:
      tags: [Operations]
      summary: Queue source synchronization
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "202":
          description: Synchronization queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: integer, format: int64 }
                  status: { type: string, const: queued }
        default: { $ref: "#/components/responses/Error" }
  /source-categories:
    get:
      tags: [Operations]
      summary: List source category options
      responses:
        "200": { description: Source categories }
        default: { $ref: "#/components/responses/Error" }
  /subscription-settings:
    get:
      deprecated: true
      tags: [Subscription]
      summary: Get compatibility subscription settings
      responses:
        "200": { description: Subscription settings }
        default: { $ref: "#/components/responses/Error" }
    put:
      deprecated: true
      tags: [Subscription]
      summary: Update compatibility subscription settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Subscription settings updated }
        default: { $ref: "#/components/responses/Error" }
  /routing-settings:
    get:
      deprecated: true
      tags: [Subscription]
      summary: Get compatibility routing settings
      responses:
        "200": { description: Routing settings }
        default: { $ref: "#/components/responses/Error" }
    put:
      deprecated: true
      tags: [Subscription]
      summary: Update compatibility routing settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Routing settings updated }
        default: { $ref: "#/components/responses/Error" }
  /panel-settings:
    get:
      tags: [System]
      summary: Get public panel branding settings
      security: []
      responses:
        "200": { description: Panel settings }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [System]
      summary: Update panel branding settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Panel settings updated }
        default: { $ref: "#/components/responses/Error" }
  /subscription-page-config:
    get:
      tags: [Subscription]
      summary: Get public subscription-page configuration
      security: []
      responses:
        "200": { description: Subscription page configuration }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [Subscription]
      summary: Update subscription-page configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Subscription page configuration updated }
        default: { $ref: "#/components/responses/Error" }
  /subscriptions/activate:
    post:
      tags: [Subscription]
      summary: Activate a public subscription code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [activation_code]
              properties:
                activation_code: { type: string }
      responses:
        "200": { description: Subscription activated }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /templates:
    get:
      tags: [Subscription]
      summary: List subscription templates
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SubscriptionTemplate" }
    post:
      tags: [Subscription]
      summary: Create a template
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionTemplate" }
        default: { $ref: "#/components/responses/Error" }
  /templates/preview:
    post:
      tags: [Subscription]
      summary: Validate and preview a template without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "200":
          description: Rendered sample
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: string }
                  content_type: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /templates/{id}:
    put:
      tags: [Subscription]
      summary: Update a template
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "200": { description: Updated }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Subscription]
      summary: Delete a non-system template
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /response-rules:
    get:
      tags: [Subscription]
      summary: List ordered response rules
      responses:
        "200":
          description: Ordered by priority then id
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ResponseRule" }
    post:
      tags: [Subscription]
      summary: Create a response rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponseRuleInput" }
      responses:
        "201": { description: Rule created }
        default: { $ref: "#/components/responses/Error" }
  /response-rules/{id}:
    put:
      tags: [Subscription]
      summary: Update a response rule
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponseRuleInput" }
      responses:
        "200": { description: Updated }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Subscription]
      summary: Delete a non-system rule
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /subscription-delivery-settings:
    get:
      tags: [Subscription]
      summary: Get announcements, global headers and status remarks
      responses:
        "200":
          description: Delivery settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionDeliverySettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [Subscription]
      summary: Update announcements, global headers and status remarks
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionDeliverySettingsUpdate" }
      responses:
        "200": { description: Updated }
        default: { $ref: "#/components/responses/Error" }
  /api-tokens:
    get:
      tags: [Security]
      summary: List API token metadata
      responses:
        "200": { description: Token list }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Security]
      summary: Create an API token
      description: Requires an interactive owner session. The secret is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, maxLength: 80 }
                scopes:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [read, "users:write", "keys:write", "settings:write"] }
                expires_at: { type: string, format: date-time }
      responses:
        "201":
          description: Token metadata and one-time secret
        default: { $ref: "#/components/responses/Error" }
  /api-tokens/{id}:
    delete:
      tags: [Security]
      summary: Revoke an API token
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }
  /audit-events:
    get:
      tags: [Operations]
      summary: Paginate structured audit events
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200": { description: Audit page }
        default: { $ref: "#/components/responses/Error" }
  /jobs:
    get:
      tags: [Operations]
      summary: Paginate source synchronization and key-check jobs
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200": { description: Job page }
        default: { $ref: "#/components/responses/Error" }
  /jobs/{id}:
    get:
      tags: [Operations]
      summary: Poll a background job
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Current job state }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{id}/retry:
    post:
      tags: [Operations]
      summary: Retry a failed retryable job
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "202": { description: Retry queued }
        default: { $ref: "#/components/responses/Error" }
  /sources/{id}/sync-runs:
    get:
      tags: [Operations]
      summary: Source synchronization history
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Recent synchronization runs }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: subshare_admin_session
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: ss_<random>
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Query:
      name: query
      in: query
      schema: { type: string, maxLength: 200 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    AdministratorPassword:
      type: string
      minLength: 15
      maxLength: 256
      writeOnly: true
      description: Exact, unnormalized password value; spaces are allowed and UTF-8 encoding is limited to 1024 bytes.
    CreateAdministrator:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username: { type: string, minLength: 1 }
        password: { $ref: "#/components/schemas/AdministratorPassword" }
        role: { type: string, enum: [viewer, operator, owner, support_admin, super_admin] }
    UpdateAdministrator:
      type: object
      additionalProperties: false
      properties:
        password: { $ref: "#/components/schemas/AdministratorPassword" }
        role: { type: string, enum: [viewer, operator, owner, support_admin, super_admin] }
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        field_errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        request_id: { type: string }
    PageMeta:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    PageEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: {} }
        meta: { $ref: "#/components/schemas/PageMeta" }
    BuildInfo:
      type: object
      required: [version, commit, build_time, schema_version]
      properties:
        version: { type: string }
        commit: { type: string }
        build_time: { type: string }
        schema_version: { type: integer }
    CreateUser:
      type: object
      additionalProperties: false
      required: [name, activation_code, status, issue_days]
      properties:
        name: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 320 }
        activation_code: { type: string, maxLength: 200 }
        status: { type: string, enum: [active, paused, blocked] }
        issue_days: { type: integer, minimum: 0 }
        blocked_reason: { type: string, maxLength: 500 }
    PatchUserSubscription:
      type: object
      additionalProperties: false
      properties:
        status: { type: [string, "null"], enum: [active, paused, blocked, null] }
        starts_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        blocked_reason: { type: [string, "null"], maxLength: 500 }
        subscription_name: { type: [string, "null"], maxLength: 200 }
        subscription_refresh_hours: { type: [integer, "null"], minimum: 1, maximum: 8760 }
        subscription_info_url: { type: [string, "null"], format: uri }
        subscription_extra_url: { type: [string, "null"], format: uri }
        subscription_extra_status: { type: [string, "null"], maxLength: 200 }
    KeyAssignment:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [all, selected] }
        key_ids:
          type: array
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
    UserSummary:
      type: object
      required: [id, name, status, effective_status]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
        status: { type: string }
        effective_status: { type: string, enum: [active, expired, paused, blocked, limited] }
        starts_at: { type: string }
        expires_at: { type: string }
        max_devices: { type: integer }
        connected_device_count: { type: integer }
        created_at: { type: string, format: date-time }
    KeySummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        client_display_name: { type: string }
        category: { type: string }
        kind: { type: string }
        status: { type: string }
        check_status: { type: string }
        check_error: { type: string }
        last_latency_ms: { type: integer, format: int64 }
        last_checked_at: { type: string }
        external_source_id: { type: integer, format: int64 }
        external_source_name: { type: string }
        protocol: { $ref: "#/components/schemas/ProfileProtocol" }
        profile_schema_version: { type: integer, minimum: 0 }
        profile_compatibility: { $ref: "#/components/schemas/ProfileCompatibility" }
        profile_warnings:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
    KeyProfileEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/KeyProfileDetail" }
    KeyProfileDetail:
      type: object
      description: Secret-safe key detail. Presence flags may be returned, but credential values are omitted.
      required: [id, label, client_display_name, client_display_name_overridden, kind, status, protocol, profile_revision, profile_warnings]
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        client_display_name: { type: string }
        client_display_name_overridden:
          type: boolean
          description: True when client_display_name is an explicit local override rather than a source/raw-derived fallback.
        category_id: { type: [integer, "null"], format: int64 }
        category: { type: string }
        kind: { type: string, enum: [real, informational] }
        status: { type: string, enum: [active, non-active] }
        check_status: { type: string }
        check_error: { type: object, additionalProperties: true }
        last_latency_ms: { type: integer, format: int64 }
        last_checked_at: { type: string }
        template_text: { type: string }
        ownership: { type: object, additionalProperties: true }
        external_source_id: { type: [integer, "null"], format: int64 }
        external_source_name: { type: string }
        protocol: { $ref: "#/components/schemas/ProfileProtocol" }
        profile_schema_version: { type: integer, minimum: 0 }
        profile_compatibility: { $ref: "#/components/schemas/ProfileCompatibility" }
        profile_warnings:
          type: array
          items: { type: string }
        profile_revision: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        safe_structured: { type: object, additionalProperties: true }
        unknown_query_parameters:
          type: array
          items: { type: object, additionalProperties: true }
        capabilities: { type: object, additionalProperties: true }
    CreateKeyProfile:
      type: object
      additionalProperties: false
      required: [label, status, kind, creation_mode]
      properties:
        label: { type: string, minLength: 1, maxLength: 255 }
        client_display_name: { type: string, maxLength: 255 }
        category_id: { type: [integer, "null"], format: int64, minimum: 1 }
        category: { type: string }
        status: { type: string, enum: [active, non-active] }
        kind: { type: string, enum: [real, informational] }
        template_text: { type: string, maxLength: 8192 }
        creation_mode: { type: string, enum: [raw, structured] }
        raw_uri: { type: string, writeOnly: true, maxLength: 65535 }
        protocol: { $ref: "#/components/schemas/ProfileProtocol" }
        structured:
          type: object
          writeOnly: true
          description: Protocol-specific structured profile fields.
          additionalProperties: true
    UpdateKeyProfile:
      type: object
      additionalProperties: false
      required: [label, status, kind, profile_revision, patch_mode]
      properties:
        label: { type: string, minLength: 1, maxLength: 255 }
        client_display_name:
          type: string
          maxLength: 255
          description: Omit to preserve the current client-facing name. For source-owned profiles this is the only mutable field; an empty value clears the local override.
        category_id: { type: [integer, "null"], format: int64, minimum: 1 }
        category: { type: string }
        status: { type: string, enum: [active, non-active] }
        kind: { type: string, enum: [real, informational] }
        template_text: { type: string, maxLength: 8192 }
        profile_revision: { type: integer, format: int64, minimum: 1 }
        patch_mode: { type: string, enum: [raw, structured] }
        raw_uri: { type: string, writeOnly: true, maxLength: 65535 }
        structured_patch:
          type: object
          writeOnly: true
          description: Protocol-specific tri-state structured patch fields.
          additionalProperties: true
    KeyRevealRequest:
      type: object
      additionalProperties: false
      required: [profile_revision, target]
      properties:
        profile_revision: { type: integer, format: int64, minimum: 1 }
        target: { type: string, enum: [raw, structured-secrets] }
    KeyRevealEnvelope:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - { $ref: "#/components/schemas/RawKeyReveal" }
            - { $ref: "#/components/schemas/StructuredKeyReveal" }
    RawKeyReveal:
      type: object
      required: [key_id, confirmed_profile_revision, target, raw_uri]
      properties:
        key_id: { type: integer, format: int64 }
        confirmed_profile_revision: { type: integer, format: int64 }
        target: { type: string, const: raw }
        raw_uri: { type: string, readOnly: true }
    StructuredKeyReveal:
      type: object
      required: [key_id, confirmed_profile_revision, target, secrets]
      properties:
        key_id: { type: integer, format: int64 }
        confirmed_profile_revision: { type: integer, format: int64 }
        target: { type: string, const: structured-secrets }
        secrets:
          type: object
          readOnly: true
          additionalProperties: { type: string }
    KeyCloneRequest:
      type: object
      additionalProperties: false
      required: [expected_profile_revision]
      properties:
        expected_profile_revision: { type: integer, format: int64, minimum: 1 }
        new_label: { type: string, maxLength: 255 }
    KeyIDsRequest:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
    BulkKeyStatusRequest:
      type: object
      additionalProperties: false
      required: [ids, status]
      properties:
        ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [active, non-active] }
        category: { type: string }
    KeyCategory:
      type: object
      required: [id, name, color, keys_count]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        color: { type: string }
        keys_count: { type: integer, minimum: 0 }
    CreateKeyCategory:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        color: { type: string }
    UpdateKeyCategory:
      type: object
      additionalProperties: false
      required: [old_name, new_name]
      properties:
        old_name: { type: string, minLength: 1 }
        new_name: { type: string, minLength: 1 }
        color: { type: string }
    RenameKeyCategory:
      type: object
      additionalProperties: false
      required: [old_name, new_name]
      properties:
        old_name: { type: string, minLength: 1 }
        new_name: { type: string, minLength: 1 }
    DeleteKeyCategory:
      type: object
      additionalProperties: false
      required: [name, mode]
      properties:
        name: { type: string, minLength: 1 }
        mode: { type: string, enum: [keep_keys, delete_with_keys] }
    KeyCategoryOrder:
      type: object
      additionalProperties: false
      required: [names]
      properties:
        names:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
    SourceSummary:
      type: object
      required: [id, name, source_url_masked, enabled, has_hwid_value, import_status, imported_keys]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        category: { type: string }
        key_category: { type: string }
        source_url_masked: { type: string }
        enabled: { type: boolean }
        pass_hwid: { type: boolean }
        has_hwid_value: { type: boolean }
        last_import_count: { type: integer }
        imported_keys: { type: integer }
        import_status: { type: string, enum: [idle, syncing, ok, error] }
        last_error: { type: string }
        last_synced_at: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
    SourceDetail:
      allOf:
        - { $ref: "#/components/schemas/SourceSummary" }
        - type: object
          properties:
            source_url: { type: string, format: uri }
            key_insert_mode: { type: string, enum: [top, bottom] }
            hwid_version: { type: string }
            hwid_model_name: { type: string }
            meta_title: { type: string }
            meta_refresh_hours: { type: integer }
            meta_support_url: { type: string }
            meta_web_page_url: { type: string }
            meta_announce: { type: string }
    SourceInput:
      type: object
      required: [name, category, key_category, key_insert_mode, source_url, enabled, pass_hwid]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Trimmed source name, limited to 64 Unicode code points.
        category: { type: string }
        key_category: { type: string }
        key_insert_mode: { type: string, enum: [top, bottom] }
        source_url: { type: string, format: uri }
        enabled: { type: boolean }
        apply_remote_metadata: { type: boolean }
        pass_hwid: { type: boolean }
        hwid_version: { type: string }
        hwid_model_name: { type: string }
        hwid_value:
          type: string
          description: Omit on update to preserve the stored secret.
        clear_hwid_value:
          type: boolean
          description: Explicitly remove the stored HWID value.
        raw_body: { type: string, maxLength: 1048576 }
        raw_content_type: { type: string }
        raw_final_url: { type: string, format: uri }
        selected_item_refs:
          type: array
          uniqueItems: true
          description: Optional references from preview. Apply reparses the authoritative body and rejects any reference that no longer matches.
          items: { type: string, pattern: '^ir1_[0-9a-f]{32}$' }
    SourcePreviewInput:
      type: object
      additionalProperties: false
      required: [source_url]
      properties:
        source_url: { type: string, format: uri }
        pass_hwid: { type: boolean }
        hwid_version: { type: string }
        hwid_model_name: { type: string }
        hwid_value: { type: string, writeOnly: true }
        raw_body: { type: string, maxLength: 1048576, writeOnly: true }
        raw_content_type: { type: string }
        raw_final_url: { type: string, format: uri }
    ProfileProtocol:
      type: string
      enum: [legacy, vless, vmess, trojan, xray-json, shadowsocks, hysteria2, tuic]
    ProfileCompatibility:
      type: string
      enum: [legacy, full, read_only, unsupported]
    ExternalImportItemStatus:
      type: string
      enum: [accepted, rejected, duplicate, updated, unchanged, compatibility_only, ambiguous, unsupported]
    ExternalImportResultCounts:
      type: object
      required: [accepted, rejected, duplicate, updated, unchanged, compatibility_only, ambiguous, unsupported]
      properties:
        accepted: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        duplicate: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        compatibility_only: { type: integer, minimum: 0 }
        ambiguous: { type: integer, minimum: 0 }
        unsupported: { type: integer, minimum: 0 }
    ExternalImportItem:
      type: object
      required: [item_ref, line_index, protocol, scheme, display_name, host, port, compatibility, status, warnings]
      properties:
        item_ref: { type: string, pattern: '^ir1_[0-9a-f]{32}$' }
        line_index: { type: integer, minimum: 1 }
        protocol: { type: string }
        scheme: { type: string }
        display_name: { type: string }
        label: { type: string, deprecated: true }
        host: { type: string }
        port: { type: string }
        compatibility: { $ref: "#/components/schemas/ProfileCompatibility" }
        status: { $ref: "#/components/schemas/ExternalImportItemStatus" }
        warnings:
          type: array
          items: { type: string }
        error_code: { type: string }
        url_short:
          type: string
          deprecated: true
          description: Secret-free host/port summary retained for old clients; never a URI.
    SourcePreview:
      type: object
      required: [source_url, suggested_name, detected_format, key_count, warnings, result_counts, keys]
      properties:
        source_url: { type: string, format: uri }
        suggested_name: { type: string }
        detected_format: { type: string, enum: [links, xray-json] }
        key_count: { type: integer, minimum: 0 }
        metadata: { type: object }
        warnings:
          type: array
          items: { type: string }
        result_counts: { $ref: "#/components/schemas/ExternalImportResultCounts" }
        keys:
          type: array
          items: { $ref: "#/components/schemas/ExternalImportItem" }
    TemplateInput:
      type: object
      required: [name, format, content, enabled]
      properties:
        name: { type: string, maxLength: 80 }
        format: { type: string, enum: [base64, plain, xray-json, mihomo, sing-box] }
        content: { type: string, maxLength: 1048576 }
        enabled: { type: boolean }
    SubscriptionTemplate:
      allOf:
        - { $ref: "#/components/schemas/TemplateInput" }
        - type: object
          properties:
            id: { type: integer, format: int64 }
            slug: { type: string }
            is_system: { type: boolean }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    RuleCondition:
      type: object
      required: [headerName, operator, value, caseSensitive]
      properties:
        headerName: { type: string, maxLength: 80 }
        operator:
          type: string
          enum: [EQUALS, NOT_EQUALS, CONTAINS, NOT_CONTAINS, STARTS_WITH, NOT_STARTS_WITH, ENDS_WITH, NOT_ENDS_WITH, REGEX, NOT_REGEX]
        value: { type: string, maxLength: 255 }
        caseSensitive: { type: boolean }
    RuleHeader:
      type: object
      required: [key, value]
      properties:
        key: { type: string, maxLength: 80 }
        value: { type: string, maxLength: 1024 }
    ResponseRuleInput:
      type: object
      required: [name, enabled, priority, operator, conditions, response_type, headers]
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 250 }
        enabled: { type: boolean }
        priority: { type: integer, minimum: 0, maximum: 100000 }
        operator: { type: string, enum: [AND, OR] }
        conditions:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/RuleCondition" }
        response_type: { type: string, enum: [browser, base64, plain, xray-json, mihomo, sing-box, block, not-found] }
        template_id: { type: [integer, "null"], format: int64 }
        headers:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/RuleHeader" }
    ResponseRule:
      allOf:
        - { $ref: "#/components/schemas/ResponseRuleInput" }
        - type: object
          properties:
            id: { type: integer, format: int64 }
            is_system: { type: boolean }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    SubscriptionDeliverySettingsUpdate:
      type: object
      additionalProperties: false
      required: [response_headers, announcement, remarks]
      properties:
        response_headers:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/RuleHeader" }
        announcement: { type: string, maxLength: 200 }
        remarks:
          type: object
          additionalProperties: false
          required: [expired, paused, blocked, limited, empty]
          properties:
            expired: { $ref: "#/components/schemas/RemarkList" }
            paused: { $ref: "#/components/schemas/RemarkList" }
            blocked: { $ref: "#/components/schemas/RemarkList" }
            limited: { $ref: "#/components/schemas/RemarkList" }
            empty: { $ref: "#/components/schemas/RemarkList" }
    SubscriptionDeliverySettings:
      allOf:
        - { $ref: "#/components/schemas/SubscriptionDeliverySettingsUpdate" }
        - type: object
          required: [capabilities, generation_exclusion_reason_codes]
          properties:
            capabilities:
              type: array
              readOnly: true
              description: Backend-owned protocol/output capability matrix. Official syntax validation never implies runtime interoperability.
              items: { $ref: "#/components/schemas/ProtocolCapability" }
            generation_exclusion_reason_codes:
              type: array
              readOnly: true
              description: Stable non-sensitive codes used by delivery exclusion headers and all-excluded errors.
              items: { type: string }
    ProtocolCapability:
      type: object
      required: [protocol, generation, outputs]
      properties:
        protocol: { type: string, enum: [vless, vmess, trojan, shadowsocks, hysteria2, tuic], readOnly: true }
        generation: { type: string, readOnly: true }
        outputs:
          type: object
          readOnly: true
          additionalProperties: { $ref: "#/components/schemas/OutputCapability" }
    OutputCapability:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [supported, unsupported, conditionally_supported, compatibility_only], readOnly: true }
        reason_code: { type: string, readOnly: true }
        target_version: { type: string, readOnly: true }
        minimum_version: { type: string, readOnly: true }
        syntax_validation: { type: string, enum: [structurally_generated, official_binary, address_probe_only], readOnly: true }
        runtime_interoperability: { type: string, enum: [not_tested], readOnly: true }
    SubscriptionGenerationFailure:
      type: object
      required: [error_code, output_format, eligible_count, excluded_count, exclusion_counts]
      properties:
        error_code: { type: string, enum: [all_profiles_excluded] }
        output_format: { type: string, enum: [mihomo, sing-box, xray-json] }
        eligible_count: { type: integer, minimum: 1 }
        excluded_count: { type: integer, minimum: 1 }
        exclusion_counts:
          type: object
          additionalProperties: { type: integer, minimum: 1 }
    RemarkList:
      type: array
      maxItems: 10
      items: { type: string, maxLength: 200 }
