# SubShare production stack.
#
# First start:
#   Ubuntu: bash scripts/start.sh
#   Windows: powershell -ExecutionPolicy Bypass -File .\scripts\start.ps1
#
# Direct Compose usage is also supported after creating .env:
#   docker compose up -d --build --wait

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${BUILD_VERSION:-dev}
        COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: subshare-backend:${BUILD_VERSION:-local}
    restart: unless-stopped

    env_file:
      - .env
    environment:
      # The backend validates all environment values before opening SQLite or
      # accepting requests. See .env.example for accepted values and defaults.
      APP_ENV: production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      BASE_URL: ${BASE_URL:?Set BASE_URL in .env}
      DB_PATH: /app/data/app.db
      BACKUP_PATH: ${BACKUP_PATH:-/app/data/backups/app.db}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}

    volumes:
      - app-data:/app/data

    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
        reservations:
          memory: 64M
          cpus: "0.25"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

    stop_grace_period: 15s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: subshare-frontend:${BUILD_VERSION:-local}
    restart: unless-stopped

    environment:
      BASE_URL: ${BASE_URL:?Set BASE_URL in .env}

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    depends_on:
      backend:
        condition: service_healthy

    volumes:
      - caddy-data:/data
      - caddy-config:/config

    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 32M
          cpus: "0.1"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

    stop_grace_period: 10s
    networks:
      - internal

  # Runs only when explicitly requested by the start scripts. It imports an
  # existing bind-mounted SQLite database into the new named volume, and never
  # overwrites a database already present in that volume.
  migrate-legacy-data:
    image: alpine:3.22.1
    profiles:
      - tools
    user: "0:0"
    network_mode: none
    volumes:
      - ./data:/legacy:ro
      - app-data:/target
    command:
      - /bin/sh
      - -ec
      - |
        if [ -f /target/app.db ]; then
          echo "Named volume already contains app.db; legacy import skipped."
          exit 0
        fi
        if [ ! -f /legacy/app.db ]; then
          echo "No legacy data/app.db found; nothing to import."
          exit 0
        fi
        cp /legacy/app.db /target/app.db
        if [ -f /legacy/app.db-wal ]; then cp /legacy/app.db-wal /target/app.db-wal; fi
        if [ -f /legacy/app.db-shm ]; then cp /legacy/app.db-shm /target/app.db-shm; fi
        chown -R 1000:1000 /target
        chmod 700 /target
        chmod 600 /target/app.db*
        echo "Legacy SQLite data imported into the named volume."

volumes:
  app-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
