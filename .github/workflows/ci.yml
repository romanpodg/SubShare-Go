name: SubShare CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject tracked runtime artifacts
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(server|server\.exe|tmp\.exe)$|(^|/)backups/.*\.(db|sqlite|sqlite3)(-wal|-shm)?$|(^|/)\.env$|(^|/)certs/' || true)"
          if [ -n "$forbidden" ]; then
            echo "Tracked runtime or secret-bearing artifacts are forbidden:"
            echo "$forbidden"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          # the complexity backlog is tracked, not blocking; new issues fail the build
          only-new-issues: true

      - name: Build
        run: go build ./cmd/server

      - name: Install Go test reporter
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Test
        run: gotestsum --junitfile .cache/junit/go.xml -- -covermode=atomic -coverprofile=coverage.out ./...

      - name: Migration compatibility test
        run: gotestsum --junitfile .cache/junit/migration.xml -- ./internal/storage -run TestMigrateAppliesVersionedMigrationsIdempotently -count=1

      - name: Race-check user mutation concurrency
        run: >-
          go test -race ./cmd/server
          -run '^(TestUserActivationConcurrentRequestsHaveOneWinner|TestUserDeviceConcurrentRegistrationsRespectLastSlot|TestSubscriptionMutationConcurrentPatch.*)$'
          -count=1

      # Fork PRs have no repository secrets; tests still run, uploads are skipped.
      - name: Upload Go coverage
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          disable_search: true
          fail_ci_if_error: true
          flags: backend
          name: go-coverage

      - name: Upload Go test results
        if: ${{ !cancelled() && hashFiles('.cache/junit/go.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: .cache/junit/go.xml
          disable_search: true
          fail_ci_if_error: true
          flags: backend
          name: go-tests

      - name: Upload migration test results
        if: ${{ !cancelled() && hashFiles('.cache/junit/migration.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: .cache/junit/migration.xml
          disable_search: true
          fail_ci_if_error: true
          flags: migration
          name: migration-compatibility

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Component tests
        working-directory: frontend
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=../.cache/junit/vitest.xml

      - name: Upload component test results
        if: ${{ !cancelled() && hashFiles('.cache/junit/vitest.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: .cache/junit/vitest.xml
          disable_search: true
          fail_ci_if_error: true
          flags: frontend-unit
          name: vitest

      - name: Build
        working-directory: frontend
        run: npm run build

      # Analyze the existing Turbopack static export without changing bundlers.
      # Keep this Linux/macOS-only tool out of Windows frontend dependencies.
      - name: Install bundle analyzer
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: npm install --prefix "$RUNNER_TEMP/codecov-bundle" --ignore-scripts --no-package-lock --no-audit --no-fund @codecov/bundle-analyzer@2.0.1

      - name: Upload frontend bundle analysis
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          CODECOV_BUNDLE_ANALYZER_DIR: ${{ runner.temp }}/codecov-bundle
        run: node scripts/codecov-bundle.cjs

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload E2E test results
        if: ${{ !cancelled() && hashFiles('frontend/test-results/playwright.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: frontend/test-results/playwright.xml
          disable_search: true
          fail_ci_if_error: true
          flags: frontend-e2e
          name: playwright

  deployment:
    name: docker deployment smoke
    runs-on: ubuntu-latest
    needs: [build, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create CI environment
        shell: bash
        run: |
          cp .env.example .env
          sed -i "s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^PROFILE_FINGERPRINT_KEY=.*/PROFILE_FINGERPRINT_KEY=$(openssl rand -hex 32)/" .env
          sed -i 's|^BASE_URL=.*|BASE_URL=http://localhost|' .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build deployment images
        run: docker compose build

      - name: Validate HTTP and HTTPS Caddy configurations
        shell: bash
        run: |
          docker compose run --rm --no-deps -e BASE_URL=http://localhost frontend \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose run --rm --no-deps -e BASE_URL=https://example.com frontend \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Start clean stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: Verify proxy, frontend and persistent database
        shell: bash
        run: |
          curl --fail --silent --show-error http://localhost/health
          curl --fail --silent --show-error http://localhost/admin/login > /dev/null
          docker compose exec -T backend sh -ec 'test -s /app/data/app.db'
          docker compose restart backend
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Tear down CI stack
        if: always()
        run: docker compose down -v --remove-orphans
