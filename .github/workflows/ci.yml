name: SubShare CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject tracked runtime artifacts
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(server|server\.exe|tmp\.exe)$|(^|/)backups/.*\.(db|sqlite|sqlite3)(-wal|-shm)?$|(^|/)\.env$' || true)"
          if [ -n "$forbidden" ]; then
            echo "Tracked runtime or secret-bearing artifacts are forbidden:"
            echo "$forbidden"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/server

      - name: Test
        run: go test ./...

      - name: Migration compatibility test
        run: go test ./cmd/server -run TestMigrateAppliesVersionedMigrationsIdempotently -count=1

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Component tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        working-directory: frontend
        run: npm run test:e2e
