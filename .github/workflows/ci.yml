name: SubShare CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject tracked runtime artifacts
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(server|server\.exe|tmp\.exe)$|(^|/)backups/.*\.(db|sqlite|sqlite3)(-wal|-shm)?$|(^|/)\.env$|(^|/)certs/' || true)"
          if [ -n "$forbidden" ]; then
            echo "Tracked runtime or secret-bearing artifacts are forbidden:"
            echo "$forbidden"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/server

      - name: Test
        run: go test ./...

      - name: Migration compatibility test
        run: go test ./cmd/server -run TestMigrateAppliesVersionedMigrationsIdempotently -count=1

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Component tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        working-directory: frontend
        run: npm run test:e2e

  deployment:
    name: docker deployment smoke
    runs-on: ubuntu-latest
    needs: [build, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create CI environment
        shell: bash
        run: |
          cp .env.example .env
          sed -i "s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i 's|^BASE_URL=.*|BASE_URL=http://localhost|' .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build deployment images
        run: docker compose build

      - name: Validate HTTP and HTTPS Caddy configurations
        shell: bash
        run: |
          docker compose run --rm --no-deps -e BASE_URL=http://localhost frontend \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose run --rm --no-deps -e BASE_URL=https://example.com frontend \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Start clean stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: Verify proxy, frontend and persistent database
        shell: bash
        run: |
          curl --fail --silent --show-error http://localhost/health
          curl --fail --silent --show-error http://localhost/admin/login > /dev/null
          docker compose exec -T backend sh -ec 'test -s /app/data/app.db'
          docker compose restart backend
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Tear down CI stack
        if: always()
        run: docker compose down -v --remove-orphans
