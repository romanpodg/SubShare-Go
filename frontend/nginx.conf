# =============================================================================
# Xray Sub Frontend - nginx configuration
# =============================================================================
# Serves the Next.js static export and reverse-proxies API requests to the
# Go backend service. The backend hostname is resolved via Docker Compose
# service discovery (service name: "backend").
#
# The upstream name and port can be overridden by setting BACKEND_URL as an
# environment variable, but the default matches docker-compose.yml.
# =============================================================================

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Reverse proxy: API requests -> Go backend
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if ever needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # -------------------------------------------------------------------------
    # Reverse proxy: Subscription delivery -> Go backend
    # -------------------------------------------------------------------------
    location /sub/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # -------------------------------------------------------------------------
    # Reverse proxy: Health endpoint -> Go backend
    # -------------------------------------------------------------------------
    location = /health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # -------------------------------------------------------------------------
    # Static files: Next.js export
    # -------------------------------------------------------------------------
    # Serve pre-rendered HTML for known routes. Next.js static export
    # generates files like /admin.html, /subscription.html, etc.

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Caching for static assets
    # -------------------------------------------------------------------------
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /static/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Favicon and manifest
    location ~* \.(ico|svg|png|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
