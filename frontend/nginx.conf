# =============================================================================
# Xray Sub Frontend - nginx configuration
# =============================================================================
# Serves the Next.js static export and reverse-proxies API requests to the
# Go backend service. The backend hostname is resolved via Docker Compose
# service discovery (service name: "backend").
#
# The upstream name and port can be overridden by setting BACKEND_URL as an
# environment variable, but the default matches docker-compose.yml.
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP server — ACME challenge + redirect to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 3000;
    server_name _;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS server
# ---------------------------------------------------------------------------
server {
    listen 3443 ssl;
    server_name _;

    # ------------------------------------------------------------------
    # SSL certificates (mounted from host: ./certs)
    # ------------------------------------------------------------------
    # SSL certificates (mounted from ./certs — populated by certbot or manually)
    ssl_certificate     /etc/nginx/certs/live/cert-0001/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/cert-0001/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Let's Encrypt ACME challenge (LE follows HTTP→HTTPS redirects)
    # -------------------------------------------------------------------------
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Reverse proxy: API requests -> Go backend
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if ever needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # -------------------------------------------------------------------------
    # Reverse proxy: Subscription delivery -> Go backend
    # -------------------------------------------------------------------------
    location /sub/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # -------------------------------------------------------------------------
    # Reverse proxy: Health endpoint -> Go backend
    # -------------------------------------------------------------------------
    location = /health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # -------------------------------------------------------------------------
    # Static files: Next.js export
    # -------------------------------------------------------------------------
    # Serve pre-rendered HTML for known routes. Next.js static export
    # generates files like /admin.html, /subscription.html, etc.

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Caching for static assets
    # -------------------------------------------------------------------------
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /static/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Favicon and manifest
    location ~* \.(ico|svg|png|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
